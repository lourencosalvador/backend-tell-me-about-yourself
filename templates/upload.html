<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PAP Upload - Google Drive</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 1.1rem;
        }

        .tabs {
            display: flex;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }

        .tab {
            flex: 1;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            border: none;
            background: transparent;
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .tab.active {
            background: white;
            color: #667eea;
            border-bottom: 3px solid #667eea;
        }

        .tab:hover {
            background: #e9ecef;
        }

        .tab-content {
            padding: 30px;
        }

        .tab-pane {
            display: none;
        }

        .tab-pane.active {
            display: block;
        }

        /* Upload Form */
        .upload-form {
            max-width: 600px;
            margin: 0 auto;
        }

        .form-group {
            margin-bottom: 25px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #333;
        }

        .form-control {
            width: 100%;
            padding: 15px;
            border: 2px solid #e9ecef;
            border-radius: 8px;
            font-size: 1rem;
            transition: border-color 0.3s ease;
        }

        .form-control:focus {
            outline: none;
            border-color: #667eea;
        }

        .file-input {
            position: relative;
            overflow: hidden;
            display: inline-block;
            width: 100%;
        }

        .file-input input[type=file] {
            position: absolute;
            left: -9999px;
        }

        .file-input-label {
            display: block;
            padding: 20px;
            border: 2px dashed #667eea;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #f8f9ff;
        }

        .file-input-label:hover {
            background: #e9ecff;
            border-color: #5a6fd8;
        }

        .btn {
            background: linear-gradient(45deg, #667eea, #764ba2);
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            width: 100%;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        .btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        /* Progress Bar */
        .progress {
            width: 100%;
            height: 6px;
            background: #e9ecef;
            border-radius: 3px;
            overflow: hidden;
            margin: 20px 0;
            display: none;
        }

        .progress-bar {
            height: 100%;
            background: linear-gradient(45deg, #667eea, #764ba2);
            width: 0%;
            transition: width 0.3s ease;
        }

        /* Videos Grid */
        .videos-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 25px;
            margin-top: 20px;
        }

        .video-card {
            background: white;
            border-radius: 12px;
            box-shadow: 0 8px 25px rgba(0,0,0,0.1);
            overflow: hidden;
            transition: all 0.3s ease;
        }

        .video-card:hover {
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
        }

        .video-player {
            position: relative;
            height: 200px;
            background: #000;
            border-radius: 8px 8px 0 0;
            overflow: hidden;
        }

        .video-player video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .video-thumbnail {
            height: 200px;
            background: linear-gradient(45deg, #667eea, #764ba2);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 3rem;
        }

        .video-info {
            padding: 20px;
        }

        .video-title {
            font-weight: 600;
            margin-bottom: 10px;
            color: #333;
        }

        .video-meta {
            font-size: 0.9rem;
            color: #666;
            margin-bottom: 15px;
        }

        .video-actions {
            display: flex;
            gap: 10px;
        }

        .btn-sm {
            padding: 8px 15px;
            font-size: 0.9rem;
            flex: 1;
        }

        .btn-outline {
            background: transparent;
            color: #667eea;
            border: 2px solid #667eea;
        }

        .btn-outline:hover {
            background: #667eea;
            color: white;
        }

        /* Loading */
        .loading {
            text-align: center;
            padding: 40px;
            color: #666;
        }

        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #667eea;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Messages */
        .message {
            padding: 15px;
            border-radius: 8px;
            margin: 20px 0;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>🚀 PAP Upload Service</h1>
            <p>Upload de vídeos para Google Drive com extração automática de áudio</p>
        </div>

        <div class="tabs">
            <button class="tab active" onclick="showTab('upload')">📤 Upload</button>
            <button class="tab" onclick="showTab('videos')">📁 Meus Vídeos</button>
        </div>

        <div class="tab-content">
            <!-- Upload Tab -->
            <div id="upload" class="tab-pane active">
                <div class="upload-form">
                    <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Upload de Vídeo</h2>
                    
                    <form id="uploadForm">
                        <div class="form-group">
                            <label for="userId">ID do Usuário:</label>
                            <input type="text" id="userId" class="form-control" value="f996fb59-1da2-49bf-bf58-9575cffb5747" readonly>
                        </div>

                        <div class="form-group">
                            <label>Selecionar Vídeo:</label>
                            <div class="file-input">
                                <input type="file" id="videoFile" accept="video/*" required>
                                <label for="videoFile" class="file-input-label">
                                    📁 Clique aqui para selecionar um vídeo<br>
                                    <small>Formatos aceitos: MP4, AVI, MOV, etc.</small>
                                </label>
                            </div>
                        </div>

                        <div class="progress" id="progressBar">
                            <div class="progress-bar" id="progressFill"></div>
                        </div>

                        <button type="submit" class="btn" id="uploadBtn">
                            🚀 Fazer Upload
                        </button>
                    </form>

                    <div id="uploadMessage"></div>
                </div>
            </div>

            <!-- Videos Tab -->
            <div id="videos" class="tab-pane">
                <h2 style="text-align: center; margin-bottom: 30px; color: #333;">Meus Vídeos no Google Drive</h2>
                
                <div style="text-align: center; margin-bottom: 20px;">
                    <button class="btn" onclick="loadVideos()" style="width: auto; padding: 10px 20px;">
                        🔄 Atualizar Lista
                    </button>
                </div>

                <div id="videosContainer">
                    <div class="loading">
                        <div class="spinner"></div>
                        <p>Carregando vídeos...</p>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const userId = 'f996fb59-1da2-49bf-bf58-9575cffb5747';

        // Tab Navigation
        function showTab(tabName) {
            // Hide all tabs
            document.querySelectorAll('.tab-pane').forEach(pane => {
                pane.classList.remove('active');
            });
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });

            // Show selected tab
            document.getElementById(tabName).classList.add('active');
            event.target.classList.add('active');

            // Load videos when videos tab is opened
            if (tabName === 'videos') {
                loadVideos();
            }
        }

        // File Upload
        document.getElementById('videoFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            const label = document.querySelector('.file-input-label');
            
            if (file) {
                label.innerHTML = `
                    ✅ ${file.name}<br>
                    <small>Tamanho: ${(file.size / 1024 / 1024).toFixed(2)} MB</small>
                `;
            }
        });

        // Upload Form
        document.getElementById('uploadForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const fileInput = document.getElementById('videoFile');
            const uploadBtn = document.getElementById('uploadBtn');
            const progressBar = document.getElementById('progressBar');
            const progressFill = document.getElementById('progressFill');
            const messageDiv = document.getElementById('uploadMessage');
            
            if (!fileInput.files[0]) {
                showMessage('Por favor, selecione um vídeo!', 'error');
                return;
            }

            const formData = new FormData();
            formData.append('file', fileInput.files[0]);

            uploadBtn.disabled = true;
            uploadBtn.textContent = '⏳ Enviando...';
            progressBar.style.display = 'block';
            messageDiv.innerHTML = '';

            try {
                const response = await fetch(`/videos/upload-python?userId=${userId}`, {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (data.success) {
                    progressFill.style.width = '100%';
                    showMessage('✅ Upload realizado com sucesso!', 'success');
                    
                    // Reset form
                    document.getElementById('uploadForm').reset();
                    document.querySelector('.file-input-label').innerHTML = `
                        📁 Clique aqui para selecionar um vídeo<br>
                        <small>Formatos aceitos: MP4, AVI, MOV, etc.</small>
                    `;
                } else {
                    throw new Error(data.error || 'Erro no upload');
                }
            } catch (error) {
                showMessage(`❌ Erro: ${error.message}`, 'error');
            } finally {
                uploadBtn.disabled = false;
                uploadBtn.textContent = '🚀 Fazer Upload';
                setTimeout(() => {
                    progressBar.style.display = 'none';
                    progressFill.style.width = '0%';
                }, 2000);
            }
        });

        // Load Videos
        async function loadVideos() {
            const container = document.getElementById('videosContainer');
            
            container.innerHTML = `
                <div class="loading">
                    <div class="spinner"></div>
                    <p>Carregando vídeos...</p>
                </div>
            `;

            try {
                const response = await fetch(`/videos/${userId}/google-drive`);
                const data = await response.json();

                if (data.success) {
                    if (data.videos.length === 0) {
                        container.innerHTML = `
                            <div style="text-align: center; padding: 40px; color: #666;">
                                📁 Nenhum vídeo encontrado<br>
                                <small>Faça upload do seu primeiro vídeo!</small>
                            </div>
                        `;
                    } else {
                        const videosGrid = data.videos.map(video => {
                            // Extrair file IDs das URLs do Google Drive para usar no microserviço
                            let videoFileId = '';
                            let audioFileId = '';
                            
                            if (video.videoUrl && video.videoUrl.includes('drive.google.com')) {
                                const videoMatch = video.videoUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                                if (videoMatch) {
                                    videoFileId = videoMatch[1];
                                }
                            }
                            
                            if (video.audioUrl && video.audioUrl.includes('drive.google.com')) {
                                const audioMatch = video.audioUrl.match(/\/d\/([a-zA-Z0-9-_]+)/);
                                if (audioMatch) {
                                    audioFileId = audioMatch[1];
                                }
                            }
                            
                            // URLs do microserviço para streaming
                            const streamVideoUrl = videoFileId ? `http://localhost:8001/stream/${videoFileId}` : '';
                            const streamAudioUrl = audioFileId ? `http://localhost:8001/stream/${audioFileId}` : '';
                            
                            return `
                            <div class="video-card">
                                <div class="video-player" style="position: relative; height: 200px; background: #000; border-radius: 8px 8px 0 0; overflow: hidden;">
                                    ${streamVideoUrl ? `
                                        <video 
                                            controls 
                                            preload="metadata"
                                            style="width: 100%; height: 100%; object-fit: cover;"
                                            poster="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23667eea'/%3E%3Ctext x='50' y='55' text-anchor='middle' fill='white' font-size='30'%3E🎬%3C/text%3E%3C/svg%3E"
                                        >
                                            <source src="${streamVideoUrl}" type="video/mp4">
                                            Seu navegador não suporta o elemento de vídeo.
                                        </video>
                                    ` : `
                                        <div style="display: flex; align-items: center; justify-content: center; height: 100%; color: white; font-size: 3rem;">
                                            🎬
                                        </div>
                                    `}
                                </div>
                                <div class="video-info">
                                    <div class="video-title">${video.name}</div>
                                    <div class="video-meta">
                                        📅 ${new Date(video.createdAt).toLocaleDateString('pt-BR')}<br>
                                        📊 ${(video.size / 1024 / 1024).toFixed(2)} MB<br>
                                        🆔 ${video.id.substring(0, 8)}...
                                    </div>
                                    <div class="video-actions">
                                        ${streamAudioUrl ? `
                                            <button onclick="playAudio('${streamAudioUrl}', '${video.name}')" class="btn btn-sm btn-outline">
                                                🎵 Áudio
                                            </button>
                                        ` : ''}
                                        <a href="${video.videoUrl}" target="_blank" class="btn btn-sm btn-outline" style="flex: 0.5;">
                                            📂 Drive
                                        </a>
                                    </div>
                                </div>
                            </div>
                        `}).join('');

                        container.innerHTML = `
                            <div style="margin-bottom: 20px;">
                                <strong>Total: ${data.totalVideos} vídeo(s) - Usuário: ${userId}</strong>
                            </div>
                            <div class="videos-grid">
                                ${videosGrid}
                            </div>
                        `;
                    }
                } else {
                    throw new Error(data.error || 'Erro ao carregar vídeos');
                }
            } catch (error) {
                container.innerHTML = `
                    <div class="message error">
                        ❌ Erro ao carregar vídeos: ${error.message}
                    </div>
                `;
            }
        }

        // Show Message
        function showMessage(message, type) {
            const messageDiv = document.getElementById('uploadMessage');
            messageDiv.innerHTML = `<div class="message ${type}">${message}</div>`;
            
            setTimeout(() => {
                messageDiv.innerHTML = '';
            }, 5000);
        }

        // Play Audio Function
        function playAudio(audioUrl, videoName) {
            // Criar modal para player de áudio
            const modal = document.createElement('div');
            modal.style.cssText = `
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                height: 100%;
                background: rgba(0,0,0,0.8);
                display: flex;
                align-items: center;
                justify-content: center;
                z-index: 1000;
            `;
            
            modal.innerHTML = `
                <div style="
                    background: white;
                    padding: 30px;
                    border-radius: 15px;
                    max-width: 500px;
                    width: 90%;
                    text-align: center;
                ">
                    <h3 style="margin-bottom: 20px; color: #333;">🎵 Reproduzindo Áudio</h3>
                    <p style="margin-bottom: 20px; color: #666; word-break: break-all;">
                        ${videoName.replace('.mp4', '.mp3')}
                    </p>
                    <audio controls style="width: 100%; margin-bottom: 20px;">
                        <source src="${audioUrl}" type="audio/mpeg">
                        Seu navegador não suporta o elemento de áudio.
                    </audio>
                    <button onclick="this.closest('[style*=\"position: fixed\"]').remove()" 
                            style="
                                background: #667eea;
                                color: white;
                                border: none;
                                padding: 10px 20px;
                                border-radius: 8px;
                                cursor: pointer;
                            ">
                        ✖ Fechar
                    </button>
                </div>
            `;
            
            // Fechar modal ao clicar fora
            modal.addEventListener('click', function(e) {
                if (e.target === modal) {
                    modal.remove();
                }
            });
            
            document.body.appendChild(modal);
        }

        // Load videos on page load
        document.addEventListener('DOMContentLoaded', function() {
            // Load videos when page loads if videos tab is active
            if (document.getElementById('videos').classList.contains('active')) {
                loadVideos();
            }
        });
    </script>
</body>

</html>
